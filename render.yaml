databases:
  - name: telefonoshdb
    plan: free
    databaseName: telefonosh
    user: telefonosh

services:
  - type: web
    plan: free
    name: telefonosh-backend
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: telefonoshdb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
